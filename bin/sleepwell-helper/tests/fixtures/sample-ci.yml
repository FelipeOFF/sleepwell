name: sample-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: test
        run: |
          npm test
          npm run coverage

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: shellcheck
        run: shellcheck scripts/*.sh
