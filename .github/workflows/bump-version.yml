name: Bump version & release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Custom version (used only when bump=custom). Format: X.Y.Z (no 'v' prefix)."
        type: string
        required: false
        default: ""
      dry_run:
        description: "Dry run — compute version, do not commit/tag/push"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.compute.outputs.new_version }}
      new_tag: ${{ steps.compute.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve current version
        id: current
        run: |
          set -euo pipefail
          # Prefer the latest bin-v* tag as source of truth; fall back to Cargo.toml.
          last_tag=$(git tag --list 'bin-v*' --sort=-v:refname | head -1 || true)
          if [ -n "$last_tag" ]; then
            current="${last_tag#bin-v}"
            source="tag $last_tag"
          else
            current=$(grep -m1 '^version' bin/sleepwell-helper/Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
            source="Cargo.toml"
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "source=$source"   >> "$GITHUB_OUTPUT"
          echo "Current version: $current (from $source)"

      - name: Compute new version
        id: compute
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
          CURRENT: ${{ steps.current.outputs.current }}
        run: |
          set -euo pipefail
          if [ "$BUMP" = "custom" ]; then
            if [ -z "$CUSTOM" ]; then
              echo "::error::bump=custom requires custom_version input"
              exit 1
            fi
            if ! [[ "$CUSTOM" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::custom_version '$CUSTOM' is not in X.Y.Z format"
              exit 1
            fi
            new="$CUSTOM"
          else
            IFS='.' read -r major minor patch <<<"$CURRENT"
            case "$BUMP" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
              *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
            esac
            new="${major}.${minor}.${patch}"
          fi

          # Refuse downgrade.
          highest=$(printf '%s\n%s\n' "$CURRENT" "$new" | sort -V | tail -1)
          if [ "$highest" != "$new" ] || [ "$CURRENT" = "$new" ]; then
            echo "::error::computed version '$new' must be greater than current '$CURRENT'"
            exit 1
          fi

          tag="bin-v${new}"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi

          echo "new_version=$new" >> "$GITHUB_OUTPUT"
          echo "new_tag=$tag"     >> "$GITHUB_OUTPUT"
          echo ""
          echo "Bump type:    $BUMP"
          echo "Current:      $CURRENT"
          echo "New version:  $new"
          echo "New tag:      $tag"

      - name: Update version files
        if: ${{ inputs.dry_run == false }}
        env:
          NEW: ${{ steps.compute.outputs.new_version }}
        run: |
          set -euo pipefail
          # 1. bin/sleepwell-helper/Cargo.toml — leftmost version line.
          python3 - "$NEW" <<'PY'
          import re, sys, pathlib
          new = sys.argv[1]
          for path in [
              "bin/sleepwell-helper/Cargo.toml",
          ]:
              p = pathlib.Path(path)
              src = p.read_text()
              out = re.sub(r'^(version\s*=\s*")[0-9.]+(")', r'\g<1>' + new + r'\2',
                           src, count=1, flags=re.M)
              if out == src:
                  raise SystemExit(f"no version field updated in {path}")
              p.write_text(out)
              print(f"updated {path}")
          PY

          # 2. .claude-plugin/plugin.json + marketplace.json (JSON-aware).
          python3 - "$NEW" <<'PY'
          import json, sys, pathlib
          new = sys.argv[1]

          plugin = pathlib.Path(".claude-plugin/plugin.json")
          d = json.loads(plugin.read_text())
          d["version"] = new
          plugin.write_text(json.dumps(d, indent=2, ensure_ascii=False) + "\n")
          print("updated plugin.json")

          mkt = pathlib.Path(".claude-plugin/marketplace.json")
          if mkt.exists():
              m = json.loads(mkt.read_text())
              for plg in m.get("plugins", []):
                  if plg.get("name") == "sleepwell":
                      plg["version"] = new
              mkt.write_text(json.dumps(m, indent=2, ensure_ascii=False) + "\n")
              print("updated marketplace.json")
          PY

          # 3. Refresh Cargo.lock so it tracks the new version.
          if command -v cargo >/dev/null; then
            (cd bin/sleepwell-helper && cargo update -p sleepwell-helper --precise "$NEW" 2>/dev/null || cargo generate-lockfile)
          fi

      - name: Generate changelog section
        if: ${{ inputs.dry_run == false }}
        id: changelog
        env:
          NEW: ${{ steps.compute.outputs.new_version }}
        run: |
          set -euo pipefail
          # Determine "from" reference: previous v* plugin tag if any,
          # otherwise fall back to the previous bin-v* tag so the very
          # first run after bootstrap still produces a meaningful range.
          from=$(git tag --list 'v*' --sort=-v:refname \
                 | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+-' | head -1 || true)
          if [ -z "$from" ]; then
            # No plugin v* tag yet — fall back to the most recent helper
            # tag. The new bin-v* tag is only created in a later step,
            # so head -1 gives the previous bump's baseline correctly.
            from=$(git tag --list 'bin-v*' --sort=-v:refname | head -1 || true)
          fi

          chmod +x scripts/generate-changelog.sh
          section=$(scripts/generate-changelog.sh "$NEW" "$from" HEAD)

          # Save the section as both a step output and a file for the
          # release step. Use the heredoc form to handle multiline.
          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$section"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

          mkdir -p .ci-tmp
          printf '%s\n' "$section" > .ci-tmp/release-body.md

          # Prepend new section to CHANGELOG.md (idempotent — replace any
          # pre-existing v${NEW} section if rerun manually).
          touch CHANGELOG.md
          python3 - "$NEW" .ci-tmp/release-body.md CHANGELOG.md <<'PY'
          import re, sys, pathlib
          new_ver, body_path, changelog_path = sys.argv[1], sys.argv[2], sys.argv[3]
          body = pathlib.Path(body_path).read_text()
          changelog = pathlib.Path(changelog_path)
          src = changelog.read_text() if changelog.exists() else ""

          # Remove any existing block for this exact version.
          pattern = re.compile(
              rf'(?ms)^## v{re.escape(new_ver)}\s+—.*?(?=^## v|\Z)'
          )
          src = pattern.sub("", src)

          if src.lstrip().startswith("# Changelog"):
              # Insert after header block.
              parts = re.split(r'(?m)(?=^## v)', src, maxsplit=1)
              header = parts[0].rstrip() + "\n\n"
              tail = parts[1] if len(parts) > 1 else ""
              out = header + body.rstrip() + "\n\n" + tail
          else:
              header = "# Changelog\n\nAll notable changes to **sleepwell** are documented here.\n\n"
              out = header + body.rstrip() + "\n\n" + src.lstrip()

          changelog.write_text(out)
          print(f"changelog updated for v{new_ver}")
          PY

      - name: Commit and tag
        if: ${{ inputs.dry_run == false }}
        env:
          NEW: ${{ steps.compute.outputs.new_version }}
          TAG: ${{ steps.compute.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bin/sleepwell-helper/Cargo.toml bin/sleepwell-helper/Cargo.lock \
                  .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                  CHANGELOG.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::warning::no version files changed (already at $NEW?)"
          else
            git commit -m "chore(release): bump to v${NEW}

          Triggered by workflow_dispatch (${{ inputs.bump }}).
          Tag ${TAG} will fire the release workflow to build and publish artifacts."
          fi

          # Two tags: v* for the plugin (changelog target), bin-v* for the
          # helper binary (release.yml target).
          git tag -a "v${NEW}" -m "sleepwell v${NEW}"
          git tag -a "$TAG"   -m "sleepwell-helper v${NEW}"

          git push origin HEAD:main
          git push origin "v${NEW}"
          git push origin "$TAG"

      - name: Create plugin GitHub Release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.compute.outputs.new_version }}
        run: |
          set -euo pipefail
          # Wait for the tag to be visible to the API before creating the release.
          sleep 5
          gh release create "v${NEW}" \
            --title "sleepwell v${NEW}" \
            --notes-file .ci-tmp/release-body.md \
            -R "${{ github.repository }}"
          echo "Created plugin release v${NEW}"

      - name: Trigger helper release workflow for the new tag
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.compute.outputs.new_tag }}
        run: |
          set -euo pipefail
          # Tag-pushes from GITHUB_TOKEN do NOT trigger downstream workflows
          # (anti-loop protection). Workflow_dispatch is the documented
          # exception, so we kick release.yml explicitly with the new tag
          # as ref. The release job sees github.ref=refs/tags/<tag> and
          # uploads helper binaries to the matching bin-v* release.
          sleep 5
          gh workflow run release.yml --ref "$TAG" -R "${{ github.repository }}"
          echo "Dispatched release.yml for $TAG"

      - name: Summary
        run: |
          {
            echo "## Bump version summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Bump type | \`${{ inputs.bump }}\` |"
            echo "| Current   | \`${{ steps.current.outputs.current }}\` (from ${{ steps.current.outputs.source }}) |"
            echo "| New       | \`${{ steps.compute.outputs.new_version }}\` |"
            echo "| Helper tag | \`${{ steps.compute.outputs.new_tag }}\` |"
            echo "| Plugin tag | \`v${{ steps.compute.outputs.new_version }}\` |"
            echo "| Dry run    | \`${{ inputs.dry_run }}\` |"
            if [ -f .ci-tmp/release-body.md ]; then
              echo ""
              echo "### Changelog"
              echo ""
              cat .ci-tmp/release-body.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
